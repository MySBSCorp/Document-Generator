# ---------------------------------------------------------------------------
# Security response headers for the Document Generator vhost.
# Install to: /etc/nginx/docgen-security-headers.conf
#
# WHY THIS IS A SEPARATE FILE, NOT INLINE IN THE SERVER BLOCK:
# nginx's add_header inheritance is replace-not-merge. A `location` block that
# contains even one add_header of its own silently DISCARDS every add_header
# inherited from the parent server block. So any location that sets a header
# must restate all of them — hence one file, included in each place that
# needs it. (The vhost avoids the problem in cache locations by using
# `expires`, which is a different directive and does not trigger the reset.)
#
# Deliberately NOT set here: a full Content-Security-Policy. index.html ships
# its own detailed policy in a <meta> tag, tuned to this app (cdnjs for the
# three SRI-pinned scripts, login.microsoftonline.com for MSAL, 'self' for
# the vendored modules). When a page has both a meta and a header policy, the
# browser enforces the INTERSECTION — so a broad header policy here could
# only ever break things, never loosen them. The one directive below exists
# because <meta> CSP cannot express frame-ancestors at all; it is header-only.
# ---------------------------------------------------------------------------

# Clickjacking. script.js has a JS frame-buster as a last resort, but that
# runs only after the page has already rendered inside the attacker's frame.
# These two stop the frame from ever loading. X-Frame-Options is the legacy
# form, kept for older browsers; frame-ancestors is the modern one.
add_header X-Frame-Options "DENY" always;
add_header Content-Security-Policy "frame-ancestors 'none'" always;

# HSTS. 2 years, and this app is HTTPS-only in production.
# Do NOT add `includeSubDomains` unless every host under mysbscorp.com is
# already HTTPS — it would apply to all of them, and browsers cache it hard.
# Add `preload` only when you actually intend to submit to hstspreload.org,
# which is effectively irreversible.
add_header Strict-Transport-Security "max-age=63072000" always;

# Stop MIME sniffing. Matters most for the vendored .wasm.js / .traineddata.gz
# blobs, which must be treated as the type nginx declares, not guessed at.
add_header X-Content-Type-Options "nosniff" always;

# Referrer-Policy: no-referrer, not the usual strict-origin-when-cross-origin.
# This app's only outbound navigations are to login.microsoftonline.com, which
# needs no Referer, so there is no reason to leak this host in one.
add_header Referrer-Policy "no-referrer" always;

# Isolate this browsing context from anything that opens it, and from
# cross-origin popups it opens. Cheap defence for a page holding SSN/EIN data
# and MSAL tokens in sessionStorage.
add_header Cross-Origin-Opener-Policy "same-origin" always;

# The app reads local PDFs the user explicitly picks via <input type="file">
# and needs no device or ambient permissions whatsoever. Deny the lot.
add_header Permissions-Policy "accelerometer=(), camera=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), payment=(), usb=()" always;
