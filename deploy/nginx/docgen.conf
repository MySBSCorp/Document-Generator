# ===========================================================================
# Document Generator — nginx vhost
#
# Install to:
#   Amazon Linux / RHEL : /etc/nginx/conf.d/docgen.conf              (auto-included)
#   Ubuntu / Debian     : /etc/nginx/sites-available/docgen.conf
#                         + symlink into /etc/nginx/sites-enabled/
#
# Serves a purely static site. There is no application server, no proxy_pass,
# and no server-side code — every library is vendored under vendor/ and all
# W-9 parsing, OCR and .docx generation happens in the browser. Nothing
# sensitive ever reaches this instance, which is the main reason the config is
# this short.
#
# Replace docgen.mysbscorp.com below if you use a different hostname. The
# hostname matters beyond DNS: it becomes the MSAL redirect URI (authConfig.js
# derives it from window.location.origin), so it must byte-for-byte match a
# "Single-page application" redirect URI registered in Entra ID.
#
# Before reloading:  sudo nginx -t
# ===========================================================================

# --- HTTP: redirect to HTTPS, except the ACME challenge --------------------
server {
    listen      80;
    listen      [::]:80;
    server_name docgen.mysbscorp.com;

    # Certbot's webroot plugin drops its challenge file here. Kept reachable
    # over plain HTTP because renewals must work before/without a valid cert.
    # This must sit ABOVE the catch-all redirect or renewals 301 into a loop.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# --- HTTPS: the site ------------------------------------------------------
server {
    # `listen 443 ssl http2;` rather than the newer `http2 on;` directive:
    # the old form works on every nginx from 1.9 through current (it only
    # logs a deprecation notice on 1.25+), whereas `http2 on;` is a hard
    # "unknown directive" error before 1.25.1. Check `nginx -v` and switch to
    # the modern form if you are on 1.25.1+ and want the warning gone.
    listen      443 ssl http2;
    listen      [::]:443 ssl http2;
    server_name docgen.mysbscorp.com;

    # scripts/deploy.sh rsyncs each release into releases/<timestamp>/ and
    # then repoints this symlink, so a deploy is atomic from nginx's point of
    # view. nginx resolves the symlink per request and needs no reload.
    root  /var/www/docgen/current;
    index index.html;

    # --- TLS (paths written by certbot --nginx) ---------------------------
    ssl_certificate     /etc/letsencrypt/live/docgen.mysbscorp.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/docgen.mysbscorp.com/privkey.pem;
    # Certbot's managed cipher/protocol baseline. If these two files do not
    # exist on your box, delete these lines and set ssl_protocols /
    # ssl_ciphers explicitly instead.
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    ssl_session_cache   shared:SSL_docgen:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # OCSP stapling. The resolver is the VPC-provided DNS server, which every
    # EC2 instance can reach; without a resolver nginx cannot fetch the OCSP
    # response and silently skips stapling.
    ssl_stapling        on;
    ssl_stapling_verify on;
    resolver            169.254.169.253 valid=300s;
    resolver_timeout    5s;

    access_log /var/log/nginx/docgen.access.log;
    error_log  /var/log/nginx/docgen.error.log warn;

    # Do not advertise the nginx version in responses or error pages.
    server_tokens off;

    include /etc/nginx/docgen-security-headers.conf;

    # Nothing is ever uploaded TO this server — file pickers are read locally
    # by JS. Cap request bodies low to shrink the attack surface.
    client_max_body_size 64k;

    # --- Compression ------------------------------------------------------
    # Worth enabling: script.js is ~70 KB and the vendored ES modules total
    # ~840 KB of highly compressible JS.
    gzip            on;
    gzip_vary       on;
    gzip_min_length 1024;
    gzip_comp_level 6;
    gzip_proxied    any;
    gzip_types      text/plain text/css text/javascript application/javascript application/json image/svg+xml;
    # NOTE: gzip_types must never include application/gzip — see the
    # eng.traineddata.gz block below for why.

    # --- Deny rules (must precede the caching locations) ------------------

    # Dotfiles: .git, .env, .build-info.json, editor swap files. The negative
    # lookahead keeps /.well-known/ reachable so ACME still works over HTTPS.
    location ~ /\.(?!well-known) {
        deny all;
        access_log off;
        log_not_found off;
        return 404;
    }

    # Belt-and-braces. `npm run build` already produces a dist/ containing
    # only the six runtime files plus vendor/, so none of these paths should
    # exist on the instance at all. This is here for the day somebody rsyncs
    # the repo root by hand instead of dist/ — tests/e2e.js contains absolute
    # paths to real W-9 fixtures, and AUTH.md is 24 KB describing the auth
    # design. Neither belongs on the public web.
    location ~* ^/(tests|scripts|deploy|node_modules|\.github)/ {
        deny all;
        return 404;
    }
    location ~* \.(md|env|example|sh|mjs|lock|pem|key|log|bak|orig)$ {
        deny all;
        return 404;
    }
    location ~* ^/(package|package-lock)\.json$ {
        deny all;
        return 404;
    }

    # --- Health check -----------------------------------------------------
    # Cheap liveness probe that does not touch the filesystem. Note this
    # proves nginx is up, NOT that a release is present — scripts/deploy.sh
    # fetches / and greps the body for that.
    location = /healthz {
        default_type text/plain;
        access_log   off;
        return       200 "ok\n";
    }

    # --- Tesseract OCR language data --------------------------------------
    # THE MOST FRAGILE THING IN THIS FILE. Tesseract.js fetches this .gz and
    # gunzips it in its own worker. If nginx (or a CDN, or gzip_static)
    # advertises `Content-Encoding: gzip` on it, the browser transparently
    # inflates it first, Tesseract then tries to inflate already-inflated
    # bytes, and OCR fails with an opaque error on scanned W-9s only — while
    # text-layer PDFs keep working, so it looks like a parsing bug.
    #
    # `gzip off` here is what prevents that. Also: do NOT enable gzip_static
    # anywhere that covers this path, and do not let a proxy re-encode it.
    # An exact-match (=) location wins over every regex location above.
    location = /vendor/tesseract/eng.traineddata.gz {
        gzip       off;
        expires    1y;
        access_log off;
    }

    # --- Caching ----------------------------------------------------------
    # These blocks use `expires` and NOT add_header, on purpose: add_header in
    # a location discards all inherited add_header directives, which would
    # quietly drop the security headers above. `expires` has no such effect.

    # vendor/ filenames carry their version (pizzip-3.2.0.esm.js), and
    # script.js imports them by exact name, so a new version is a new URL.
    # Safe to cache hard.
    location ^~ /vendor/ {
        expires 1y;

        # `^~` tells nginx to stop and skip ALL regex locations once this
        # prefix wins — which is what gets vendor/ a 1y cache instead of the
        # 1h `\.(js|css)$` rule below, but also means the `\.md$` deny rule
        # above never runs for anything under /vendor/. vendor/README.md is
        # the integrity manifest, so re-deny it here, nested inside the
        # prefix where it will actually be evaluated.
        # (`npm run build` already strips it from dist/; this is what holds
        # if someone rsyncs the repo root by hand instead.)
        location ~* \.(md|txt)$ {
            deny all;
            return 404;
        }
    }

    # Root-level assets are versioned by query string instead
    # (style.css?v=20260813-8), which is easy to forget to bump. One hour is
    # long enough to help repeat visitors and short enough that a forgotten
    # bump self-heals the same morning rather than a year later.
    # If you would rather cache these hard, bump the ?v= values in index.html
    # on every change and raise this to 1y.
    location ~* \.(js|css)$ {
        expires 1h;
    }

    # index.html must never be cached: it is the file that names the current
    # ?v= of every other asset, so a stale copy pins stale everything.
    location = / {
        expires -1;
        try_files /index.html =404;
    }
    location = /index.html {
        expires -1;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
