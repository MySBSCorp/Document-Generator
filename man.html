<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>2D Businessman CSS</title>
  <style>
    :root {
      --skin: #f7cbac;
      --hair: #5a3d28;
      --suit: #2c5d63;
      --suit-dark: #1f4347;
      --tie: #d93829;
      --briefcase: #9b5338;
      --briefcase-dark: #7c412a;
      --shirt: #ffffff;
      --shoe: #1e2830;
      --belt: #4a2c11;
    }

    body {
      background-color: #ffffff;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
    }

    .man-container {
      position: relative;
      width: 200px;
      height: 380px;
    }

    /* --- Head & Face --- */
    .head {
      position: absolute;
      top: 15px;
      right: 50px;
      width: 45px;
      height: 55px;
      background-color: var(--skin);
      border-radius: 40% 50% 50% 40%;
      transform: rotate(-5deg);
    }

    .hair-top {
      position: absolute;
      top: -12px;
      left: -8px;
      width: 55px;
      height: 30px;
      background-color: var(--hair);
      border-radius: 50% 60% 20% 40%;
      transform: rotate(-10deg);
    }

    .hair-back {
      position: absolute;
      top: 20px;
      right: 88px;
      width: 22px;
      height: 35px;
      background-color: var(--hair);
      border-radius: 50% 0 0 50%;
    }

    .ear {
      position: absolute;
      top: 22px;
      left: 5px;
      width: 10px;
      height: 14px;
      background-color: var(--skin);
      border-radius: 50%;
      border-left: 2px solid #e0b093;
    }

    .eyebrow {
      position: absolute;
      top: 18px;
      right: 10px;
      width: 12px;
      height: 3px;
      background-color: var(--hair);
      border-radius: 2px;
      transform: rotate(-10deg);
    }

    .eye {
      position: absolute;
      top: 23px;
      right: 11px;
      width: 4px;
      height: 6px;
      background-color: #222;
      border-radius: 50%;
    }

    .nose {
      position: absolute;
      top: 25px;
      right: -4px;
      width: 8px;
      height: 10px;
      background-color: var(--skin);
      border-radius: 40%;
    }

    .mouth {
      position: absolute;
      top: 40px;
      right: 6px;
      width: 10px;
      height: 2px;
      background-color: #b87b6c;
    }

    .neck {
      position: absolute;
      top: 60px;
      right: 68px;
      width: 16px;
      height: 22px;
      background-color: var(--skin);
    }

    /* --- Suit & Shirt --- */
    .jacket {
      position: absolute;
      top: 75px;
      right: 52px;
      width: 65px;
      height: 135px;
      background-color: var(--suit);
      border-radius: 15px 10px 5px 5px;
      clip-path: polygon(0 0, 100% 0, 85% 100%, 0% 95%);
    }

    .shirt-collar {
      position: absolute;
      top: 75px;
      right: 62px;
      width: 28px;
      height: 45px;
      background-color: var(--shirt);
      clip-path: polygon(20% 0, 80% 0, 100% 100%, 0% 100%);
      z-index: 2;
    }

    .tie {
      position: absolute;
      top: 82px;
      right: 70px;
      width: 10px;
      height: 95px;
      background-color: var(--tie);
      clip-path: polygon(30% 0, 70% 0, 100% 85%, 50% 100%, 0 85%);
      z-index: 3;
    }

    .lapel.left {
      position: absolute;
      top: 75px;
      right: 75px;
      width: 18px;
      height: 60px;
      background-color: var(--suit-dark);
      clip-path: polygon(100% 0, 0 30%, 60% 100%);
      z-index: 3;
    }

    .lapel.right {
      position: absolute;
      top: 75px;
      right: 54px;
      width: 18px;
      height: 60px;
      background-color: var(--suit-dark);
      clip-path: polygon(0 0, 100% 30%, 40% 100%);
      z-index: 3;
    }

    .jacket .button {
      position: absolute;
      top: 80px;
      right: 12px;
      width: 6px;
      height: 6px;
      background-color: #1a383b;
      border-radius: 50%;
    }

    .jacket .pocket {
      position: absolute;
      top: 95px;
      right: 8px;
      width: 22px;
      height: 2px;
      background-color: var(--suit-dark);
    }

    /* --- Belt & Legs --- */
    .belt {
      position: absolute;
      top: 188px;
      right: 58px;
      width: 52px;
      height: 10px;
      background-color: var(--belt);
      z-index: 4;
    }

    .buckle {
      position: absolute;
      top: 1px;
      left: 20px;
      width: 10px;
      height: 8px;
      border: 1px solid #d4af37;
      background-color: #888;
    }

    .leg.left {
      position: absolute;
      top: 195px;
      right: 80px;
      width: 26px;
      height: 155px;
      background-color: var(--suit);
      transform: rotate(18deg);
      transform-origin: top center;
    }

    .leg.right {
      position: absolute;
      top: 195px;
      right: 58px;
      width: 26px;
      height: 155px;
      background-color: var(--suit-dark);
      transform: rotate(-18deg);
      transform-origin: top center;
      z-index: -1;
    }

    .shoe {
      position: absolute;
      bottom: -6px;
      left: -8px;
      width: 42px;
      height: 14px;
      background-color: var(--shoe);
      border-radius: 5px 12px 2px 2px;
    }

    /* --- Arm & Briefcase --- */
    .arm {
      position: absolute;
      top: 82px;
      right: 88px;
      width: 24px;
      height: 120px;
      background-color: var(--suit);
      border-radius: 12px;
      transform: rotate(6deg);
      z-index: 5;
    }

    .hand {
      position: absolute;
      bottom: -8px;
      left: 4px;
      width: 16px;
      height: 16px;
      background-color: var(--skin);
      border-radius: 50%;
    }

    .briefcase {
      position: absolute;
      top: 115px;
      left: -40px;
      width: 80px;
      height: 55px;
      background-color: var(--briefcase);
      border: 2px solid var(--briefcase-dark);
      border-radius: 4px;
      box-shadow: inset 0 -4px 0 var(--briefcase-dark);
    }

    .briefcase .handle {
      position: absolute;
      top: -10px;
      left: 30px;
      width: 18px;
      height: 8px;
      border: 2px solid #333;
      border-bottom: none;
      border-radius: 3px 3px 0 0;
    }

    .briefcase .latch {
      position: absolute;
      top: 22px;
      left: 34px;
      width: 10px;
      height: 10px;
      background-color: #d1d1d1;
      border: 1px solid #777;
      border-radius: 2px;
    }
  </style>
</head>
<body>

  <div class="man-container">
    <div class="hair-back"></div>
    <div class="head">
      <div class="ear"></div>
      <div class="hair-top"></div>
      <div class="eyebrow"></div>
      <div class="eye"></div>
      <div class="nose"></div>
      <div class="mouth"></div>
    </div>

    <div class="neck"></div>
    <div class="shirt-collar"></div>
    <div class="tie"></div>
    <div class="jacket">
      <div class="lapel left"></div>
      <div class="lapel right"></div>
      <div class="button"></div>
      <div class="pocket"></div>
    </div>

    <div class="belt">
      <div class="buckle"></div>
    </div>
    <div class="leg left">
      <div class="shoe"></div>
    </div>
    <div class="leg right">
      <div class="shoe"></div>
    </div>

    <div class="arm">
      <div class="hand"></div>
      <div class="briefcase">
        <div class="handle"></div>
        <div class="latch"></div>
      </div>
    </div>
  </div>

</body>
</html>
