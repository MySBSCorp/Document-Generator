<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smooth Ghibli Style Walk & Lift Animation</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        .scene-container {
            position: relative;
            width: 700px;
            height: 450px;
            background: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            opacity: 0;
            animation: sceneIn 0.8s ease-out forwards;
        }

        @keyframes sceneIn {
            0% { opacity: 0; transform: scale(0.98); }
            100% { opacity: 1; transform: scale(1); }
        }

        .floor {
            position: absolute;
            bottom: 70px;
            width: 100%;
            height: 3px;
            background: #111;
        }

        /* Character shadow */
        .char-shadow {
            position: absolute;
            bottom: 68px;
            left: 58px;
            width: 46px;
            height: 10px;
            background: rgba(20, 20, 20, 0.16);
            border-radius: 50%;
            filter: blur(2px);
            transition: transform 2.4s cubic-bezier(0.25, 1, 0.5, 1), opacity 0.4s ease;
            animation: shadowPulse 0.8s ease-in-out infinite;
            z-index: 9;
        }
        @keyframes shadowPulse {
            0%, 100% { transform: scaleX(1); opacity: 0.16; }
            50% { transform: scaleX(0.8); opacity: 0.1; }
        }

        /* Elevator Shaft */
        .elevator-shaft {
            position: absolute;
            width: 150px;
            height: 250px;
            border: 3px solid #111;
            background: #fdfdfd;
            bottom: 73px;
            display: flex;
            justify-content: space-between;
            overflow: hidden;
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.08);
            transition: all 0.7s cubic-bezier(0.4, 0, 0.2, 1);
        }

        /* Indicator light above the shaft */
        .indicator-light {
            position: absolute;
            top: -14px;
            left: 50%;
            transform: translateX(-50%);
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #d33;
            box-shadow: 0 0 0 rgba(220, 60, 60, 0.6);
            transition: background 0.4s ease;
        }
        .indicator-light.lit {
            background: #4caf50;
            animation: indicatorGlow 0.9s ease-in-out infinite;
        }
        @keyframes indicatorGlow {
            0%, 100% { box-shadow: 0 0 4px 2px rgba(76, 175, 80, 0.5); }
            50% { box-shadow: 0 0 10px 5px rgba(76, 175, 80, 0.75); }
        }

        /* Elevator Doors */
        .door {
            width: 50%;
            height: 100%;
            background: linear-gradient(90deg, #e8ecef, #dfe4e8);
            border: 2px solid #111;
            position: relative;
            transition: transform 0.7s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .door::after {
            content: "";
            position: absolute;
            top: 10%;
            bottom: 10%;
            width: 2px;
            background: rgba(0,0,0,0.15);
        }
        .door-left::after { right: 6px; }
        .door-right::after { left: 6px; }

        .door-left { transform-origin: left; }
        .door-right { transform-origin: right; }

        /* Warm glow that flashes when doors open/close */
        .door-glow {
            position: absolute;
            inset: 0;
            background: radial-gradient(circle, rgba(255, 214, 130, 0.9) 0%, rgba(255, 214, 130, 0) 70%);
            opacity: 0;
            pointer-events: none;
        }
        .door-glow.flash {
            animation: glowFlash 0.6s ease-out;
        }
        @keyframes glowFlash {
            0% { opacity: 0.9; }
            100% { opacity: 0; }
        }

        /* Character Container */
        .character {
            position: absolute;
            bottom: 70px; /* Anchored directly on the floor */
            left: 50px;
            width: 80px;
            height: 120px;
            transition: transform 2.4s cubic-bezier(0.25, 1, 0.5, 1), opacity 0.4s ease;
            z-index: 10;
        }

        /* Front-facing pose shown right as the man steps in, before the doors close */
        .character-front {
            opacity: 0;
            transform: translateX(230px);
            transition: opacity 0.4s ease;
            z-index: 11;
        }

        /* Gentle forward-leaning bob / weight-shift sway for a natural brisk walk */
        .char-body {
            width: 100%;
            height: 100%;
            transform-origin: bottom center;
            animation: bodyBounce 0.8s infinite ease-in-out;
        }

        @keyframes bodyBounce {
            0%   { transform: translate(0px, 0px) rotate(4deg); }
            25%  { transform: translate(1.2px, -4px) rotate(2deg); }
            50%  { transform: translate(0px, -0.5px) rotate(5deg); }
            75%  { transform: translate(-1.2px, -4px) rotate(3deg); }
            100% { transform: translate(0px, 0px) rotate(4deg); }
        }

        /* Head bob, slightly offset from the torso for a loose, springy feel */
        .head {
            animation: headBob 0.8s infinite ease-in-out;
            transform-origin: 47px 29px;
        }
        @keyframes headBob {
            0%   { transform: translateY(0px) rotate(-2deg); }
            25%  { transform: translateY(-2.5px) rotate(1deg); }
            50%  { transform: translateY(0px) rotate(-2deg); }
            75%  { transform: translateY(-2.5px) rotate(1deg); }
            100% { transform: translateY(0px) rotate(-2deg); }
        }

        /* Hip -> knee -> ankle jointed leg strides for a proper, dynamic walk cycle */
        .thigh-left {
            transform-origin: 38.5px 71px;
            animation: thighCycle 0.8s infinite ease-in-out;
        }
        .shin-left {
            transform-origin: 38.5px 92px;
            animation: shinCycle 0.8s infinite ease-in-out;
        }
        .foot-left {
            transform-origin: 38.5px 109px;
            animation: footCycle 0.8s infinite ease-in-out;
        }

        .thigh-right {
            transform-origin: 51.5px 71px;
            animation: thighCycle 0.8s infinite ease-in-out;
            animation-delay: -0.4s;
        }
        .shin-right {
            transform-origin: 51.5px 92px;
            animation: shinCycle 0.8s infinite ease-in-out;
            animation-delay: -0.4s;
        }
        .foot-right {
            transform-origin: 51.5px 109px;
            animation: footCycle 0.8s infinite ease-in-out;
            animation-delay: -0.4s;
        }

        @keyframes thighCycle {
            0%   { transform: rotate(-26deg); }
            15%  { transform: rotate(-9deg); }
            40%  { transform: rotate(15deg); }
            50%  { transform: rotate(22deg); }
            65%  { transform: rotate(9deg); }
            85%  { transform: rotate(-20deg); }
            100% { transform: rotate(-26deg); }
        }

        /* Shin rotation is nested inside the thigh, so these are LOCAL angles that add to the
           thigh's angle to give the leg's true orientation. Keeping every value positive means the
           knee only ever bends the correct (human) way — never reverse-bends into a backward-looking kick. */
        @keyframes shinCycle {
            0%   { transform: rotate(3deg); }
            15%  { transform: rotate(3deg); }
            40%  { transform: rotate(5deg); }
            50%  { transform: rotate(12deg); }
            65%  { transform: rotate(42deg); }
            85%  { transform: rotate(8deg); }
            100% { transform: rotate(3deg); }
        }

        /* Ankle roll: flat on heel-strike, toe-down push-off, toe-up ground clearance in swing */
        @keyframes footCycle {
            0%   { transform: rotate(6deg); }
            15%  { transform: rotate(0deg); }
            40%  { transform: rotate(-7deg); }
            50%  { transform: rotate(-12deg); }
            65%  { transform: rotate(9deg); }
            85%  { transform: rotate(7deg); }
            100% { transform: rotate(6deg); }
        }

        /* Shoulders swing opposite their same-side leg (right arm ~ left leg's phase, and vice versa) */
        @keyframes swingArm {
            0%   { transform: rotate(-18deg); }
            50%  { transform: rotate(20deg); }
            100% { transform: rotate(-18deg); }
        }

        /* Elbow flex — bends a little more as the arm swings back, same phase as its shoulder */
        @keyframes elbowCycle {
            0%   { transform: rotate(8deg); }
            50%  { transform: rotate(18deg); }
            100% { transform: rotate(8deg); }
        }

        /* Front arm (shoulder to elbow) with the briefcase — matches the left leg's phase */
        .arm-briefcase {
            transform-origin: 61.5px 32px;
            animation: swingArm 0.8s infinite ease-in-out;
        }
        .forearm-front {
            transform-origin: 61.5px 46px;
            animation: elbowCycle 0.8s infinite ease-in-out;
        }

        /* Back arm (shoulder to elbow) — matches the right leg's phase, half a cycle behind */
        .arm-back {
            transform-origin: 33.5px 32px;
            animation: swingArm 0.8s infinite ease-in-out;
            animation-delay: -0.4s;
        }
        .forearm-back {
            transform-origin: 33.5px 47px;
            animation: elbowCycle 0.8s infinite ease-in-out;
            animation-delay: -0.4s;
        }


        /* Dust puff footstep particles */
        .dust {
            position: absolute;
            bottom: 72px;
            width: 8px;
            height: 8px;
            background: radial-gradient(circle, rgba(180,170,150,0.7) 0%, rgba(180,170,150,0) 70%);
            border-radius: 50%;
            pointer-events: none;
            animation: dustPuff 0.6s ease-out forwards;
            z-index: 8;
        }
        @keyframes dustPuff {
            0% { transform: translate(0, 0) scale(0.4); opacity: 0.7; }
            100% { transform: translate(-6px, -8px) scale(1.6); opacity: 0; }
        }

        /* Morph to Button State */
        .elevator-shaft.morph-to-button {
            width: 210px;
            height: 55px;
            bottom: 170px;
            border-radius: 8px;
            background: #ffffff;
            border: 2px solid #000000;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
            display: flex;
            justify-content: center;
            align-items: center;
            animation: buttonPulse 2.4s ease-in-out infinite;
        }

        @keyframes buttonPulse {
            0%, 100% { box-shadow: 0 4px 15px rgba(0,0,0,0.08); }
            50% { box-shadow: 0 4px 22px rgba(0,0,0,0.16), 0 0 0 4px rgba(0,0,0,0.03); }
        }

        .elevator-shaft.morph-to-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(0,0,0,0.15);
        }

        .elevator-shaft.morph-to-button .door,
        .elevator-shaft.morph-to-button .door-glow,
        .elevator-shaft.morph-to-button .indicator-light {
            display: none;
        }

        .button-text {
            position: absolute;
            opacity: 0;
            font-size: 16px;
            font-weight: 500;
            color: #000000;
            letter-spacing: 1px;
            transition: opacity 0.4s ease 0.3s;
            user-select: none;
        }

        .elevator-shaft.morph-to-button .button-text {
            opacity: 1;
        }

        /* Sparkle burst on morph */
        .sparkle {
            position: absolute;
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: #ffd76a;
            box-shadow: 0 0 6px 2px rgba(255, 215, 106, 0.8);
            pointer-events: none;
            opacity: 0;
        }
        .sparkle.burst {
            animation: sparkleBurst 0.9s ease-out forwards;
        }
        @keyframes sparkleBurst {
            0% { opacity: 1; transform: translate(0, 0) scale(1); }
            100% { opacity: 0; transform: translate(var(--dx), var(--dy)) scale(0.2); }
        }

        /* Click ripple on button */
        .ripple {
            position: absolute;
            border-radius: 50%;
            background: rgba(0,0,0,0.12);
            transform: scale(0);
            animation: rippleAnim 0.6s ease-out forwards;
            pointer-events: none;
        }
        @keyframes rippleAnim {
            0% { transform: scale(0); opacity: 0.5; }
            100% { transform: scale(1); opacity: 0; }
        }

        /* Replay / Click hint */
        .replay-hint {
            position: absolute;
            bottom: 25px;
            font-size: 13px;
            color: #555;
            opacity: 0;
            transition: opacity 0.4s ease;
        }

        .show-hint {
            opacity: 1;
            animation: hintFloat 2s ease-in-out infinite;
        }
        @keyframes hintFloat {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-3px); }
        }
    </style>
</head>
<body>

    <div class="scene-container">
        <div class="floor"></div>

        <!-- Shadow beneath the walking character -->
        <div class="char-shadow" id="charShadow"></div>

        <!-- Animated Character with Grounded, Fluid Walk Cycle -->
        <div class="character" id="character">
            <svg class="char-body" viewBox="0 0 80 120" xmlns="http://www.w3.org/2000/svg">

                    <ellipse cx="48" cy="20" rx="11" ry="9" fill="#dfb18c" stroke="#111" stroke-width="1"/>

                        <circle cx="67" cy="65.5" r="1.6" fill="#c53030"/>
                        <path d="M 64 59 V 57 C 64 55 70 55 70 57 V 59" stroke="#111" stroke-width="1.5" fill="none"/>
                    </g>
                </g>

                <!-- Left Leg: thigh + knee-jointed shin + sock + ankle-rolled shoe -->
                <g class="thigh-left">
                    <rect x="35" y="71" width="7" height="21" rx="3" fill="#28324a" stroke="#111" stroke-width="1.5"/>
                    <g class="shin-left">
                        <rect x="35.2" y="92" width="6.5" height="16" rx="3" fill="#28324a" stroke="#111" stroke-width="1.5"/>
                        <rect x="35.2" y="104" width="6.5" height="5" fill="#e2665a"/>
                        <g class="foot-left">
                            <path d="M 32 109 H 41 L 43.5 112.5 Q 44 115 41 115 H 32 Z" fill="#111"/>
                            <line x1="32" y1="112" x2="42" y2="112" stroke="#333" stroke-width="0.8"/>
                        </g>
                    </g>
                </g>

                <!-- Right Leg: thigh + knee-jointed shin + sock + ankle-rolled shoe -->
                <g class="thigh-right">
                    <rect x="48" y="71" width="7" height="21" rx="3" fill="#28324a" stroke="#111" stroke-width="1.5"/>
                    <g class="shin-right">
                        <rect x="48.2" y="92" width="6.5" height="16" rx="3" fill="#28324a" stroke="#111" stroke-width="1.5"/>

                            <path d="M 45 109 H 54 L 56.5 112.5 Q 57 115 54 115 H 45 Z" fill="#111"/>
                            <line x1="45" y1="112" x2="55" y2="112" stroke="#333" stroke-width="0.8"/>

                    </g>
                </g>
            </svg>
        </div>

        <!-- Front-facing pose: the man turns to face out just before the doors close -->
        <div class="character character-front" id="characterFront">
            <svg viewBox="0 0 80 120" xmlns="http://www.w3.org/2000/svg">
                <!-- Legs, standing together -->
                <rect x="33" y="71" width="7" height="21" rx="3" fill="#28324a" stroke="#111" stroke-width="1.5"/>
                <rect x="42" y="71" width="7" height="21" rx="3" fill="#28324a" stroke="#111" stroke-width="1.5"/>
                <rect x="33.2" y="92" width="6.5" height="16" rx="3" fill="#28324a" stroke="#111" stroke-width="1.5"/>
                <rect x="42.2" y="92" width="6.5" height="16" rx="3" fill="#28324a" stroke="#111" stroke-width="1.5"/>
                <rect x="33.2" y="104" width="6.5" height="5" fill="#e2665a"/>
                <rect x="42.2" y="104" width="6.5" height="5" fill="#e2665a"/>

                <line x1="41" y1="112" x2="51" y2="112" stroke="#333" stroke-width="0.8"/>

                <!-- Arms hanging at the sides, bent slightly at the elbow -->
                <rect x="21" y="32" width="7" height="15" rx="3" fill="#6b332b" stroke="#111" stroke-width="1.5"/>

                <rect x="21" y="57" width="7" height="3" fill="#efe9dd" stroke="#111" stroke-width="0.8"/>
                <circle cx="24.5" cy="62" r="3.4" fill="#dfb18c" stroke="#111" stroke-width="1"/>
                <rect x="52" y="32" width="7" height="14" rx="3" fill="#7a3b32" stroke="#111" stroke-width="1.5"/>
                <rect x="52" y="46" width="7" height="12" rx="3" fill="#7a3b32" stroke="#111" stroke-width="1.5"/>
                <rect x="52" y="55" width="7" height="3" fill="#efe9dd" stroke="#111" stroke-width="0.8"/>
                <circle cx="55.5" cy="60.5" r="3.2" fill="#dfb18c" stroke="#111" stroke-width="1"/>

                <!-- Torso / Sweater: broad shoulders tapering to a trim waist, athletic rather than round -->
                <path d="M 27 31 L 53 31 L 50 50 L 52 71 L 28 71 L 30 50 Z" fill="#7a3b32" stroke="#111" stroke-width="1.5" stroke-linejoin="round"/>
                <line x1="28" y1="71" x2="52" y2="71" stroke="#5a2b23" stroke-width="1.5"/>
                <path d="M 35 31 L 40 40 L 45 31" stroke="#5a2b23" stroke-width="1.4" fill="none" stroke-linecap="round"/>

                <!-- Briefcase held centered in front -->
                <rect x="31" y="59" width="18" height="13" rx="2.5" fill="#20242c" stroke="#111" stroke-width="1.5"/>
                <rect x="35" y="63" width="10" height="2" fill="#33394a"/>
                <circle cx="40" cy="65.5" r="1.6" fill="#c53030"/>

                <!-- Neck & Tie -->
                <rect x="35.5" y="26" width="9" height="7" fill="#dfb18c"/>
                <polygon points="40,31 43,47 40,51 37,47" fill="#c53030"/>

                <!-- Head, Face & Hair, front view: hair fills the whole head silhouette first,
                     so coverage can never gap out; the face is a smaller skin patch on top. -->
                <ellipse cx="28.5" cy="17" rx="1.8" ry="2.8" fill="#dfb18c" stroke="#111" stroke-width="1"/>
                <ellipse cx="51.5" cy="17" rx="1.8" ry="2.8" fill="#dfb18c" stroke="#111" stroke-width="1"/>
                <path d="M 30 11 Q 40 3 50 11 Q 52 19 47 24 Q 40 28 33 24 Q 28 19 30 11 Z" fill="#3a2717" stroke="#111" stroke-width="1"/>
                <ellipse cx="40" cy="20.5" rx="11.5" ry="9.5" fill="#dfb18c" stroke="#111" stroke-width="1"/>
                <path d="M 34.5 13.5 Q 37 11.8 39.5 13" stroke="#000" stroke-width="2.1" fill="none" stroke-linecap="round"/>

                <ellipse cx="44.2" cy="17" rx="1.6" ry="1.9" fill="#1a1108"/>

        <!-- Elevator Lift -->
        <div class="elevator-shaft" id="elevator">
            <div class="indicator-light" id="indicatorLight"></div>
            <div class="door door-left" id="doorLeft"></div>
            <div class="door door-right" id="doorRight"></div>
            <div class="door-glow" id="doorGlow"></div>
            <span class="button-text">ENTER OFFICE</span>
        </div>

        <div class="replay-hint" id="replayHint">Click button to replay animation</div>
    </div>

    <script>
        const character = document.getElementById('character');
        const characterFront = document.getElementById('characterFront');
        const charShadow = document.getElementById('charShadow');
        const elevator = document.getElementById('elevator');
        const doorLeft = document.getElementById('doorLeft');
        const doorRight = document.getElementById('doorRight');
        const doorGlow = document.getElementById('doorGlow');
        const indicatorLight = document.getElementById('indicatorLight');
        const replayHint = document.getElementById('replayHint');
        const sceneContainer = document.querySelector('.scene-container');

        let dustInterval = null;

        function spawnDust(x) {
            const dust = document.createElement('div');
            dust.className = 'dust';
            dust.style.left = x + 'px';
            sceneContainer.appendChild(dust);
            setTimeout(() => dust.remove(), 650);
        }

        function spawnSparkles() {
            const rect = elevator.getBoundingClientRect();
            const containerRect = sceneContainer.getBoundingClientRect();
            const cx = rect.left - containerRect.left + rect.width / 2;
            const cy = rect.top - containerRect.top + rect.height / 2;

            for (let i = 0; i < 14; i++) {
                const sparkle = document.createElement('div');
                sparkle.className = 'sparkle burst';
                const angle = (Math.PI * 2 * i) / 14;
                const dist = 60 + Math.random() * 30;
                sparkle.style.setProperty('--dx', Math.cos(angle) * dist + 'px');
                sparkle.style.setProperty('--dy', Math.sin(angle) * dist + 'px');
                sparkle.style.left = cx + 'px';
                sparkle.style.top = cy + 'px';
                sceneContainer.appendChild(sparkle);
                setTimeout(() => sparkle.remove(), 900);
            }
        }

        function runAnimation() {
            // Reset positions
            character.style.transform = 'translateX(0px)';
            character.style.opacity = '1';
            characterFront.style.opacity = '0';
            charShadow.style.transform = 'translateX(0px)';
            charShadow.style.opacity = '1';
            doorLeft.style.transform = 'scaleX(1)';
            doorRight.style.transform = 'scaleX(1)';
            elevator.classList.remove('morph-to-button');
            indicatorLight.classList.remove('lit');
            replayHint.classList.remove('show-hint');

            // Footstep dust while walking
            clearInterval(dustInterval);
            let dustX = 60;
            dustInterval = setInterval(() => {
                spawnDust(dustX);
                dustX += 22;
            }, 220);

            // Step 1: Character walks smoothly across the floor to the elevator
            setTimeout(() => {
                character.style.transform = 'translateX(230px)';
                charShadow.style.transform = 'translateX(230px)';
            }, 200);

            // Step 2: Character reaches the doorway and turns to face out
            setTimeout(() => {
                character.style.opacity = '0';
                characterFront.style.opacity = '1';
                clearInterval(dustInterval);
            }, 2300);

            // Step 3: Elevator doors close with a warm glow flash
            setTimeout(() => {
                doorLeft.style.transform = 'scaleX(0)';
                doorRight.style.transform = 'scaleX(0)';
                doorGlow.classList.add('flash');
                indicatorLight.classList.add('lit');
                setTimeout(() => doorGlow.classList.remove('flash'), 650);
            }, 2600);

            // Step 3b: The man disappears behind the closed doors, shadow fades with him
            setTimeout(() => {
                characterFront.style.opacity = '0';
                charShadow.style.opacity = '0';
            }, 3250);

            // Step 4: Lift morphs into clean white button with a sparkle burst
            setTimeout(() => {
                elevator.classList.add('morph-to-button');
                replayHint.classList.add('show-hint');
                spawnSparkles();
            }, 3450);
        }

        // Run animation on page load
        runAnimation();

        // Click on the button to replay, with a ripple effect
        elevator.addEventListener('click', (e) => {
            if (elevator.classList.contains('morph-to-button')) {
                const rect = elevator.getBoundingClientRect();
                const ripple = document.createElement('div');
                const size = Math.max(rect.width, rect.height) * 1.4;
                ripple.className = 'ripple';
                ripple.style.width = ripple.style.height = size + 'px';
                ripple.style.left = (e.clientX - rect.left - size / 2) + 'px';
                ripple.style.top = (e.clientY - rect.top - size / 2) + 'px';
                elevator.appendChild(ripple);
                setTimeout(() => ripple.remove(), 650);

                runAnimation();
            }
        });
    </script>
</body>
</html>
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>2D Businessman to MSA Button Animation</title>
  <style>
    :root {
      --skin: #f7cbac;
      --hair: #5a3d28;
      --suit: #2c5d63;
      --suit-dark: #1f4347;
      --tie: #d93829;

      --briefcase-dark: #7c412a;
      --shirt: #ffffff;

    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #ffffff;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      overflow: hidden;
    }

    /* Scene Stage */
    .stage {
      position: relative;
      width: 600px;
      height: 400px;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    /* --- Elevator (Lift) Container --- */
    .elevator-frame {
      position: absolute;
      left: 230px;
      width: 140px;
      height: 220px;
      background-color: #f2f2f2;
      border: 2px solid #222222;
      border-radius: 4px;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
      transition: all 0.8s cubic-bezier(0.4, 0, 0.2, 1);
      z-index: 2;
    }

    /* Elevator Doors */
    .door {
      position: absolute;
      top: 0;
      width: 50%;
      height: 100%;
      background-color: #8a99a6;
      border: 1px solid #6b7985;
      transition: transform 1s ease-in-out;
      z-index: 10;
    }

    .door-left {
      left: 0;
      transform: translateX(-100%); /* Initially open */
    }

    .door-right {
      right: 0;
      transform: translateX(100%); /* Initially open */
    }

    /* Doors Close State */
    .elevator-frame.close-doors .door-left,
    .elevator-frame.close-doors .door-right {
      transform: translateX(0);
    }

    /* Morphing into Button State */
    .elevator-frame.morphed-button {
      width: 260px;
      height: 54px;
      left: 170px;
      border-radius: 30px;
      background-color: #ffffff;
      border: 1.5px solid #000000;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
    }

    .elevator-frame.morphed-button .door {
      opacity: 0;
      transition: opacity 0.3s ease;
    }

    /* Button Text */
    .button-text {
      font-size: 15px;
      font-weight: 500;
      letter-spacing: 2px;
      color: #000000;
      text-transform: uppercase;
      opacity: 0;
      z-index: 20;
      transition: opacity 0.5s ease 0.4s;
      white-space: nowrap;
    }

    .elevator-frame.morphed-button .button-text {
      opacity: 1;
    }

    /* --- 2D Businessman Character --- */
    .man-container {
      position: absolute;
      right: 20px;
      width: 100px;
      height: 180px;
      transform: scale(0.65);
      z-index: 5;
      transition: transform 2.2s linear, opacity 0.4s ease 2s;
    }

    /* Walking Motion into the Lift */
    .man-container.walk-in {
      transform: translateX(-240px) scale(0.65);
    }

    .man-container.entered {
      opacity: 0; /* Fades out behind closing doors */
    }

    /* Head & Face */
    .head {
      position: absolute;
      top: 15px;
      right: 25px;
      width: 26px;
      height: 32px;
      background-color: var(--skin);
      border-radius: 40% 50% 50% 40%;
    }

    .hair-top {
      position: absolute;
      top: -6px;
      left: -4px;
      width: 34px;
      height: 20px;
      background-color: var(--hair);
      border-radius: 50% 60% 20% 40%;
    }

    .hair-back {
      position: absolute;
      top: 18px;
      right: 47px;
      width: 14px;
      height: 22px;
      background-color: var(--hair);
      border-radius: 50% 0 0 50%;
    }

    .ear {
      position: absolute;
      top: 12px;
      left: 3px;
      width: 6px;
      height: 8px;
      background-color: var(--skin);
      border-radius: 50%;
    }

    .eye {
      position: absolute;
      top: 12px;
      right: 6px;
      width: 3px;
      height: 4px;
      background-color: #222;
      border-radius: 50%;
    }

    .neck {
      position: absolute;
      top: 44px;
      right: 34px;
      width: 10px;
      height: 12px;
      background-color: var(--skin);
    }

    /* Torso & Suit */
    .jacket {
      position: absolute;
      top: 54px;
      right: 25px;
      width: 38px;
      height: 75px;
      background-color: var(--suit);
      border-radius: 8px 5px 3px 3px;
      clip-path: polygon(0 0, 100% 0, 85% 100%, 0% 95%);
    }

    .shirt-collar {
      position: absolute;
      top: 54px;
      right: 32px;
      width: 16px;
      height: 25px;
      background-color: var(--shirt);
      clip-path: polygon(20% 0, 80% 0, 100% 100%, 0% 100%);
      z-index: 2;
    }

    .tie {
      position: absolute;
      top: 58px;
      right: 36px;
      width: 6px;
      height: 52px;
      background-color: var(--tie);
      clip-path: polygon(30% 0, 70% 0, 100% 85%, 50% 100%, 0 85%);
      z-index: 3;
    }

    .belt {
      position: absolute;
      top: 120px;
      right: 28px;
      width: 32px;
      height: 6px;
      background-color: var(--belt);
      z-index: 4;
    }

    /* Legs & Walking Cycle */
    .leg.left {
      position: absolute;
      top: 125px;
      right: 42px;
      width: 15px;
      height: 85px;
      background-color: var(--suit);
      transform-origin: top center;
      animation: walkCycle 0.5s infinite alternate ease-in-out;
    }

    .leg.right {
      position: absolute;
      top: 125px;
      right: 28px;
      width: 15px;
      height: 85px;
      background-color: var(--suit-dark);
      transform-origin: top center;
      animation: walkCycle 0.5s infinite alternate-reverse ease-in-out;
      z-index: -1;
    }

    @keyframes walkCycle {
      from { transform: rotate(-16deg); }
      to { transform: rotate(16deg); }
    }

    .shoe {
      position: absolute;
      bottom: -4px;
      left: -6px;
      width: 25px;
      height: 9px;
      background-color: var(--shoe);
      border-radius: 3px 8px 1px 1px;
    }

    /* Arm & Briefcase */
    .arm {
      position: absolute;
      top: 58px;
      right: 46px;
      width: 14px;
      height: 65px;
      background-color: var(--suit);
      border-radius: 8px;
      transform: rotate(5deg);
      z-index: 5;
    }

    .briefcase {
      position: absolute;
      top: 60px;
      left: -22px;
      width: 46px;
      height: 32px;
      background-color: var(--briefcase);
      border: 1px solid var(--briefcase-dark);
      border-radius: 3px;
    }

    .briefcase .handle {
      position: absolute;
      top: -6px;
      left: 17px;
      width: 10px;
      height: 5px;
      border: 1.5px solid #333;
      border-bottom: none;
    }
  </style>
</head>
<body>

  <div class="stage">
    <div class="elevator-frame" id="elevator">
      <div class="door door-left"></div>
      <div class="door door-right"></div>
      <span class="button-text">GENERATE MSA</span>
    </div>

    <div class="man-container" id="man">
      <div class="hair-back"></div>
      <div class="head">
        <div class="ear"></div>
        <div class="hair-top"></div>
        <div class="eye"></div>
      </div>
      <div class="neck"></div>
      <div class="shirt-collar"></div>
      <div class="tie"></div>
      <div class="jacket"></div>
      <div class="belt"></div>
      <div class="leg left"><div class="shoe"></div></div>
      <div class="leg right"><div class="shoe"></div></div>
      <div class="arm">
        <div class="briefcase">
          <div class="handle"></div>
        </div>
      </div>
    </div>
  </div>

  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const man = document.getElementById("man");
      const elevator = document.getElementById("elevator");

      // 1. Man walks to the left into the elevator
      setTimeout(() => {
        man.classList.add("walk-in");
      }, 400);

      // 2. Man stops inside, elevator doors close
      setTimeout(() => {
        man.classList.add("entered");
        elevator.classList.add("close-doors");
      }, 2500);

      // 3. Elevator morphs smoothly into the "GENERATE MSA" button
      setTimeout(() => {
        elevator.classList.add("morphed-button");
      }, 3800);
    });
  </script>
</body>
</html>
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Exact Video File Stacking Loader</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #ffffff;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    .loader-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 40px;
    }

    /* --- Loading Header --- */
    .loading-header {
      font-size: 24px;
      font-weight: 700;
      color: #1e293b;
      letter-spacing: 0.5px;
    }

    /* --- 3D Stage / Isometric Camera Angle --- */
    .stage {
      position: relative;
      width: 220px;
      height: 180px;
      display: flex;
      justify-content: center;
      align-items: flex-end;
      perspective: 1000px;
    }

    /* Soft Floor Shadow */
    .ground-shadow {
      position: absolute;
      bottom: 15px;
      width: 140px;
      height: 70px;
      background: rgba(15, 23, 42, 0.1);
      border-radius: 50%;
      transform: rotateX(60deg) rotateZ(-35deg);
      filter: blur(10px);
      animation: shadowPulse 3.5s infinite ease-in-out;
    }

    @keyframes shadowPulse {
      0%, 100% { transform: rotateX(60deg) rotateZ(-35deg) scale(0.85); opacity: 0.4; }
      50% { transform: rotateX(60deg) rotateZ(-35deg) scale(1.1); opacity: 0.7; }
    }

    /* --- 3D Isometric Folder/File --- */
    .file-card {
      position: absolute;
      width: 110px;
      height: 130px;
      background: #ffffff;
      border: 1.5px solid #94a3b8;
      border-radius: 8px;
      box-shadow: 
        -2px 2px 0px #cbd5e1,
        -6px 8px 15px rgba(0, 0, 0, 0.08);
      padding: 14px 12px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      
      /* Exact Side-Isometric Perspective Angle */
      transform-style: preserve-3d;
      opacity: 0;
      animation: dropAndStack 3.5s infinite cubic-bezier(0.34, 1.3, 0.64, 1);
    }

    /* Folder Tab Top-Right Detail */
    .file-card::before {
      content: '';
      position: absolute;
      top: 0;
      right: 0;
      width: 0;
      height: 0;
      border-style: solid;
      border-width: 0 18px 18px 0;
      border-color: transparent #e2e8f0 transparent transparent;
      box-shadow: -1px 1px 2px rgba(0,0,0,0.08);
    }

    /* Mock Text Lines inside Document */
    .line {
      height: 4px;
      border-radius: 2px;
      background-color: #e2e8f0;
    }
    .line.accent { background-color: #3b82f6; width: 40%; }
    .line.full { width: 100%; }
    .line.medium { width: 70%; }

    /* Stacking Delay & Target Heights for each file */
    .file-card:nth-child(2) {
      animation-delay: 0s;
      --stack-y: 0px;
      --rot-z: -32deg;
    }

    .file-card:nth-child(3) {
      animation-delay: 0.6s;
      --stack-y: -12px;
      --rot-z: -30deg;
    }

    .file-card:nth-child(4) {
      animation-delay: 1.2s;
      --stack-y: -24px;
      --rot-z: -34deg;
    }

    .file-card:nth-child(5) {
      animation-delay: 1.8s;
      --stack-y: -36px;
      --rot-z: -31deg;
    }

    /* Stacking Motion Animation */
    @keyframes dropAndStack {
      0% {
        opacity: 0;
        transform: translateY(-180px) rotateX(58deg) rotateZ(var(--rot-z)) scale(0.85);
      }
      18% {
        opacity: 1;
      }
      38%, 82% {
        opacity: 1;
        transform: translateY(var(--stack-y)) rotateX(58deg) rotateZ(var(--rot-z)) scale(1);
      }
      100% {
        opacity: 0;
        transform: translateY(var(--stack-y)) rotateX(58deg) rotateZ(var(--rot-z)) scale(1);
      }
    }
  </style>
</head>
<body>

  <div class="loader-container">
    <div class="loading-header">
      Loading... <span id="counter">0%</span>
    </div>

    <div class="stage">
      <div class="ground-shadow"></div>

      <div class="file-card">
        <div class="line accent"></div>
        <div class="line full"></div>
        <div class="line medium"></div>
        <div class="line full"></div>
      </div>

      <div class="file-card">
        <div class="line accent"></div>
        <div class="line full"></div>
        <div class="line medium"></div>
      </div>

      <div class="file-card">
        <div class="line accent"></div>
        <div class="line full"></div>
        <div class="line full"></div>
      </div>

      <div class="file-card">
        <div class="line accent"></div>
        <div class="line medium"></div>
        <div class="line full"></div>
      </div>
    </div>
  </div>

  <script>
    // Smooth 0% to 100% Counter Script
    const counterEl = document.getElementById("counter");
    let progress = 0;

    setInterval(() => {
      progress = (progress + 1) % 101;
      counterEl.textContent = `${progress}%`;
    }, 45);
  </script>

</body>
</html>
